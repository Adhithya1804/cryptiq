# Cryptiq — public :80 front door for the single-instance AWS demo.
#
#   internet ──► nginx :80 ──► /       ──► frontend:8080  (static SPA)
#                          └─► /api/   ──► backend:8000   (FastAPI)
#
# The browser talks to ONE origin (http://<EC2_PUBLIC_IP>/). The SPA is built
# with VITE_API_BASE_URL=/api/v1, so every API call is same-origin and there is
# no CORS to configure. The backend port is never published to the host.

upstream cryptiq_frontend { server frontend:8080; }
upstream cryptiq_backend  { server backend:8000; }

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    server_tokens off;

    # Demo request body ceiling. A scan request is a tiny JSON object
    # ({repository_url, commit_sha}); this stops a trivial oversized-body
    # attempt at the unauthenticated endpoint before it reaches FastAPI.
    # The application enforces the same limit in-process (MAX_REQUEST_BODY_BYTES).
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's own liveness target for the EC2 bootstrap health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://cryptiq_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }

    location / {
        proxy_pass         http://cryptiq_frontend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
