AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cryptiq - temporary single-instance hackathon demo. One EC2 instance in a
  public subnet runs the existing Docker Compose stack (nginx :80 -> React
  frontend + FastAPI backend + in-process worker + SQLite on a dedicated
  encrypted EBS volume). Operator access is SSM Session Manager only (no SSH,
  no key pair). Container and bootstrap logs ship to CloudWatch with short
  retention. Optional secrets come from SSM Parameter Store via the instance
  role.

  Networking is either created by this stack (CreateNetwork=true: a minimal
  VPC + one public subnet + Internet Gateway + route table - no NAT Gateway,
  no ALB) so the stack deploys into a clean account with no VPC, or supplied
  through VpcId/SubnetId (CreateNetwork=false) to reuse existing networking.
  Not a production architecture - see deploy/aws/README.md.

Metadata:
  # VpcId / SubnetId are plain String parameters (default "") rather than the
  # AWS::EC2::VPC::Id / AWS::EC2::Subnet::Id types, because a typed parameter
  # cannot be left empty and it must be empty in the CreateNetwork=true path.
  # The Rules section enforces that both are set when CreateNetwork=false.
  # W1030 fires only because cfn-lint evaluates the empty default against the
  # id-shaped property position; the value is never used in that state.
  cfn-lint:
    config:
      ignore_checks:
        - W1030

Parameters:
  CreateNetwork:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      true - the stack creates a minimal VPC, one public subnet, an Internet
      Gateway and a route table (works on an account with no VPC). false -
      reuse existing networking; you must then set VpcId and SubnetId.
  VpcId:
    Type: String
    Default: ""
    AllowedPattern: ^(vpc-[0-9a-f]{8,17})?$
    Description: >
      Existing VPC id. Required only when CreateNetwork=false; leave blank when
      CreateNetwork=true.
  SubnetId:
    Type: String
    Default: ""
    AllowedPattern: ^(subnet-[0-9a-f]{8,17})?$
    Description: >
      A PUBLIC subnet in that VPC (auto-assign public IPv4 enabled). Required
      only when CreateNetwork=false; leave blank when CreateNetwork=true.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    Description: CIDR for the VPC the stack creates (CreateNetwork=true only).
  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    Description: CIDR for the public subnet the stack creates (CreateNetwork=true only).
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.medium is the tested size (2 vCPU / 4 GiB).
  RepoUrl:
    Type: String
    Description: Public git URL of this repository (cloned on first boot).
  RepoRef:
    Type: String
    Default: main
    Description: Branch or tag to deploy. Prefer a pinned tag for a demo.
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach TCP 80. Narrow it to the demo audience if you can.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14]
    Description: CloudWatch Logs retention for the demo. Keep it short.
  DataVolumeSizeGiB:
    Type: Number
    Default: 10
    MinValue: 5
    MaxValue: 50
    Description: Size of the encrypted EBS volume that holds the SQLite database.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 (resolved automatically).

Rules:
  # When reusing existing networking, both ids must be supplied. This produces a
  # clean "Parameter validation failed" message instead of a confusing resource
  # error deep in stack creation.
  ExistingNetworkNeedsIds:
    RuleCondition: !Equals [!Ref CreateNetwork, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcId, ""]]
        AssertDescription: CreateNetwork=false requires VpcId (vpc-...).
      - Assert: !Not [!Equals [!Ref SubnetId, ""]]
        AssertDescription: CreateNetwork=false requires SubnetId (subnet-...).

Conditions:
  CreateNet: !Equals [!Ref CreateNetwork, "true"]

Resources:

  # --- Networking: created only when CreateNetwork=true ------------------- #
  # Minimal public-subnet topology: VPC -> public subnet -> Internet Gateway ->
  # route table -> EC2. No NAT Gateway (the instance is in a public subnet with
  # a public IP, so outbound goes straight through the IGW), no ALB.
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateNet
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: cryptiq-demo }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNet
    Properties:
      Tags:
        - { Key: Name, Value: cryptiq-demo }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNet
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: cryptiq-demo-public }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNet
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: cryptiq-demo-public }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNet
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNet
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- CloudWatch log groups (deleted with the stack) --------------------- #
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cryptiq/backend
      RetentionInDays: !Ref LogRetentionDays
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cryptiq/frontend
      RetentionInDays: !Ref LogRetentionDays
  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cryptiq/nginx
      RetentionInDays: !Ref LogRetentionDays
  BootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cryptiq/bootstrap
      RetentionInDays: !Ref LogRetentionDays

  # --- IAM: least privilege for SSM + CloudWatch Logs + scoped params ----- #
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # AWS-recommended baseline for Session Manager. This is NOT an admin
      # policy: it grants the SSM agent's own calls plus ssm:UpdateInstance*
      # and a scoped s3/kms set for the SSM data channel.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cryptiq-cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt BackendLogGroup.Arn
                  - !GetAtt FrontendLogGroup.Arn
                  - !GetAtt NginxLogGroup.Arn
                  - !GetAtt BootstrapLogGroup.Arn
                  - !Sub "${BackendLogGroup.Arn}:*"
                  - !Sub "${FrontendLogGroup.Arn}:*"
                  - !Sub "${NginxLogGroup.Arn}:*"
                  - !Sub "${BootstrapLogGroup.Arn}:*"
        - PolicyName: cryptiq-ssm-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptiq/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # --- Network: only TCP 80 inbound ------------------------------------- #
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cryptiq demo - public HTTP only. No 22 / 8000 / 5432.
      VpcId: !If [CreateNet, !Ref Vpc, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Public demo frontend + /api proxy
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound for GitHub, Gemini, SSM, CloudWatch, package install
      Tags:
        - { Key: Name, Value: cryptiq-demo }

  # --- The instance ---------------------------------------------------- #
  Instance:
    Type: AWS::EC2::Instance
    # No DependsOn on the (conditional) IGW route: CloudFormation generally has
    # the route in place before user-data reaches the network, and the first
    # boot script retries git clone for ~60s to absorb any IGW route settle
    # time on a freshly created VPC. Keeping the dependency implicit also keeps
    # the template lint-clean in the CreateNetwork=false path.
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !If [CreateNet, !Ref PublicSubnet, !Ref SubnetId]
      SecurityGroupIds: [!Ref SecurityGroup]
      # No KeyName: administration is via SSM Session Manager only.
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
        - DeviceName: /dev/sdf
          Ebs:
            VolumeSize: !Ref DataVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            # Temporary demo: the SQLite volume is discarded on teardown.
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: cryptiq-demo }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/cloud-init-output.log) 2>&1
          dnf install -y git
          rm -rf /opt/cryptiq/app
          mkdir -p /opt/cryptiq
          # Retry: on a freshly created VPC the IGW route can settle a few
          # seconds after the instance is reachable.
          for attempt in 1 2 3 4 5 6; do
            git clone --depth 1 --branch ${RepoRef} ${RepoUrl} /opt/cryptiq/app && break
            echo "cryptiq-bootstrap: git clone attempt ${!attempt} failed; waiting for outbound network..."
            sleep 10
          done
          test -d /opt/cryptiq/app/.git
          cd /opt/cryptiq/app
          export AWS_REGION=${AWS::Region}
          export CRYPTIQ_BOOTSTRAP_LOG_GROUP=/cryptiq/bootstrap
          bash deploy/aws/user-data.sh

Outputs:
  PublicIp:
    Description: Public IPv4 of the demo instance.
    Value: !GetAtt Instance.PublicIp
  PublicUrl:
    Description: Open this in a browser.
    Value: !Sub http://${Instance.PublicIp}/
  InstanceId:
    Value: !Ref Instance
  VpcId:
    Description: VPC the demo runs in (created by this stack when CreateNetwork=true).
    Value: !If [CreateNet, !Ref Vpc, !Ref VpcId]
  SubnetId:
    Description: Public subnet the instance sits in.
    Value: !If [CreateNet, !Ref PublicSubnet, !Ref SubnetId]
  CreatedNetwork:
    Description: >
      "true" if this stack created the VPC/subnet/IGW/route table (teardown.sh
      uses this to decide whether it may remove the networking). "false" when
      VpcId/SubnetId were supplied - that networking is never touched.
    Value: !If [CreateNet, "true", "false"]
  SsmSessionCommand:
    Description: Operator shell (no SSH).
    Value: !Sub aws ssm start-session --target ${Instance} --region ${AWS::Region}
