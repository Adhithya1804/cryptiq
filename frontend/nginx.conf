# Cryptiq frontend — static SPA + same-origin API proxy.
# Loaded into /etc/nginx/conf.d/ of the nginx-unprivileged image (non-root,
# listens on 8080).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Conservative security headers for an internal/demo deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck target — never cached, no upstream needed.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy — a convenience for curl / scripts hitting the
    # frontend origin. The SPA itself calls the backend's published URL
    # directly (VITE_API_BASE_URL), which the backend allows via CORS.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: every unknown path resolves to the app shell so a refresh on
    # /inspect, /projects, /history, /review, /findings/:id, /settings/:section
    # keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
